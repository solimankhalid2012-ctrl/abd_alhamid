<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABD AL-HAMEED | Profile</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Rye&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            overflow: hidden;
            background-color: #0a0a0a;
            background-image: 
                radial-gradient(ellipse at top, rgba(80, 80, 90, 0.1) 0%, transparent 50%),
                radial-gradient(ellipse at bottom, rgba(100, 0, 0, 0.08) 0%, transparent 50%);
            color: #e8e8e8;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Playfair Display', serif;
        }

        /* ============ 1. شاشة الدخول - Çukur Style ============ */
        #entry-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 25px;
            z-index: 9999;
            cursor: pointer;
            transition: opacity 0.8s ease;
            overflow: hidden;
        }

        #intro-video {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            filter: brightness(0.7) contrast(1.15) saturate(0.7);
        }

        #entry-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                radial-gradient(ellipse at center, rgba(0, 0, 0, 0.4) 0%, rgba(0, 0, 0, 0.85) 100%),
                linear-gradient(180deg, rgba(10, 10, 10, 0.5) 0%, rgba(0, 0, 0, 0.6) 100%);
            z-index: 1;
            pointer-events: none;
        }

        #entry-screen h1 {
            font-family: 'Rye', serif;
            font-size: 42px;
            letter-spacing: 12px;
            color: #c0c0c0;
            animation: cukurPulse 3s ease-in-out infinite;
            text-align: center;
            text-shadow: 
                0 0 15px rgba(192, 192, 192, 0.9),
                0 0 30px rgba(192, 192, 192, 0.5),
                0 0 60px rgba(139, 0, 0, 0.5),
                0 3px 6px rgba(0, 0, 0, 1);
            position: relative;
            padding: 20px 40px;
            z-index: 2;
        }

        #entry-screen h1::before {
            content: '✦ ─── ✦ ─── ✦';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 8px;
            color: rgba(192, 192, 192, 0.6);
            font-family: serif;
            animation: cukurFlicker 2s ease-in-out infinite;
        }

        #entry-screen h1::after {
            content: '✦ ─── ✦ ─── ✦';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            letter-spacing: 8px;
            color: rgba(192, 192, 192, 0.6);
            font-family: serif;
            animation: cukurFlicker 2s ease-in-out infinite;
        }

        #entry-screen::after {
            content: 'press anywhere to begin your journey';
            position: absolute;
            bottom: 12%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 13px;
            letter-spacing: 4px;
            color: rgba(192, 192, 192, 0.7);
            animation: cukurFlicker 2.5s ease-in-out infinite;
            white-space: nowrap;
            z-index: 2;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 1);
        }

        @keyframes cukurPulse {
            0%, 100% { opacity: 0.85; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes cukurFlicker {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* ============ 2. خلفية الفيديو للبروفايل ============ */
        .video-bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: -2;
            filter: brightness(0.85) contrast(1.1) saturate(0.8);
            display: none;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(10, 10, 10, 0.65) 100%);
            z-index: -1;
            display: none;
        }

        /* ============ 3. البطاقة الفخمة - Çukur Style ============ */
        .container {
            height: 340px;
            width: 270px;
            color: #e8e8e8;
            perspective: 1200px;
            font-family: 'Playfair Display', serif;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 0.5s;
            display: none;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            inset: -25px;
            border-radius: 3rem;
            background: radial-gradient(
                circle,
                rgba(192, 192, 192, 0.3) 0%,
                rgba(120, 120, 130, 0.15) 35%,
                rgba(100, 0, 0, 0.1) 55%,
                transparent 75%
            );
            filter: blur(30px);
            z-index: -1;
            opacity: 0.6;
            animation: coldGlow 4s ease-in-out infinite alternate;
            pointer-events: none;
        }

        @keyframes coldGlow {
            0% { opacity: 0.5; transform: scale(0.96); }
            50% { opacity: 0.8; transform: scale(1.02); }
            100% { opacity: 1; transform: scale(1.06); }
        }

        .card {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #050505 0%, #151515 50%, #050505 100%);
            border-radius: 1.2rem;
            position: relative;
            transition: transform 1500ms cubic-bezier(0.19, 1, 0.22, 1);
            transform-style: preserve-3d;
            box-shadow: 
                0 0 50px rgba(100, 100, 110, 0.4),
                0 0 100px rgba(139, 0, 0, 0.15),
                inset 0 0 40px rgba(0, 0, 0, 0.9);
            border: 1px solid rgba(192, 192, 192, 0.2);
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 6px;
            border-radius: 0.9rem;
            border: 2px solid transparent;
            background: 
                linear-gradient(#050505, #050505) padding-box,
                linear-gradient(135deg, 
                    #c0c0c0 0%, 
                    #505058 25%, 
                    #8b0000 50%, 
                    #505058 75%, 
                    #c0c0c0 100%
                ) border-box;
            pointer-events: none;
            z-index: 1;
            opacity: 0.9;
            box-shadow: 
                inset 0 0 15px rgba(192, 192, 192, 0.15),
                0 0 15px rgba(0, 0, 0, 0.9);
        }

        .card::after {
            content: '';
            position: absolute;
            inset: 12px;
            border-radius: 0.7rem;
            border: 1px dashed rgba(192, 192, 192, 0.2);
            pointer-events: none;
            z-index: 2;
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 12%;
            position: absolute;
            width: 60%;
            background: linear-gradient(180deg, 
                #1a1a1a 0%, 
                #0f0f0f 50%, 
                #050505 100%);
            border: 2px solid #a8a8a8;
            border-top: none;
            border-radius: 0 0 0.8rem 0.8rem;
            box-shadow: 
                0px 4px 20px rgba(0, 0, 0, 0.95),
                inset 0 -4px 10px rgba(0, 0, 0, 0.7),
                0 0 15px rgba(192, 192, 192, 0.3);
            top: 0;
            left: 20%;
            z-index: 10;
            overflow: hidden;
        }

        .card-top::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, 
                transparent, 
                rgba(192, 192, 192, 0.15), 
                transparent);
            animation: cardTopShine 4s infinite;
        }

        @keyframes cardTopShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .card-top-para {
            font-size: 10px;
            font-weight: 700;
            color: #c0c0c0;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 
                0 0 10px rgba(192, 192, 192, 0.7),
                0 1px 0 rgba(0, 0, 0, 1);
            position: relative;
            z-index: 1;
            font-family: 'Rye', 'Cinzel Decorative', serif;
        }

        .container:hover > .card {
            cursor: pointer;
            transform: rotateX(180deg) rotateZ(-180deg);
        }

        /* ===== إصلاح التداخل: gap أكبر + padding أكبر ===== */
        .front,
        .back {
            height: 100%;
            width: 100%;
            border-radius: 1.2rem;
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 24px 18px 20px 18px;
            overflow: hidden;
        }

        .front {
            background: 
                radial-gradient(ellipse at 50% 0%, rgba(192, 192, 192, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 0, 0, 0.1) 0%, transparent 60%),
                linear-gradient(145deg, #151515 0%, #050505 100%);
        }

        .back {
            background: 
                radial-gradient(ellipse at 50% 100%, rgba(192, 192, 192, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 0%, rgba(139, 0, 0, 0.1) 0%, transparent 60%),
                linear-gradient(145deg, #151515 0%, #050505 100%);
            transform: rotateX(180deg) rotateZ(-180deg);
        }

        .heading {
            font-size: 16px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            font-family: 'Rye', 'Cinzel Decorative', serif;
            background: linear-gradient(
                180deg, 
                #ffffff 0%, 
                #c0c0c0 50%, 
                #505058 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: 
                drop-shadow(0 0 8px rgba(192, 192, 192, 0.7))
                drop-shadow(0 2px 4px rgba(0, 0, 0, 1));
            padding: 2px 10px 0 10px;
            position: relative;
            z-index: 3;
            line-height: 1.1;
        }

        .heading::after {
            content: '';
            display: block;
            width: 60%;
            height: 1px;
            margin: 6px auto 0;
            background: linear-gradient(90deg, 
                transparent, 
                #c0c0c0, 
                transparent);
            box-shadow: 0 0 8px rgba(192, 192, 192, 0.6);
        }

        .follow {
            font-size: 11px;
            font-weight: 500;
            color: #e8e8e8;
            text-align: center;
            letter-spacing: 2px;
            font-style: italic;
            font-family: 'Playfair Display', serif;
            opacity: 1;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(192, 192, 192, 0.25);
            text-shadow: 
                0 0 8px rgba(192, 192, 192, 0.5),
                0 1px 2px rgba(0, 0, 0, 1);
            position: relative;
            z-index: 3;
            white-space: nowrap;
        }

        /* ===== ÇUKUR - نص تركي ===== */
        .cukur-text {
            font-family: 'Rye', 'Cinzel Decorative', serif;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 5px;
            text-align: center;
            background: linear-gradient(
                180deg, 
                #ffffff 0%, 
                #c0c0c0 40%, 
                #8b0000 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            padding: 2px 10px;
            position: relative;
            z-index: 3;
            animation: cukurGlow 3s ease-in-out infinite;
            line-height: 1.1;
            margin-top: 2px;
        }

        @keyframes cukurGlow {
            0%, 100% {
                filter: 
                    drop-shadow(0 0 10px rgba(192, 192, 192, 0.7))
                    drop-shadow(0 0 20px rgba(139, 0, 0, 0.5))
                    drop-shadow(0 2px 4px rgba(0, 0, 0, 1));
                opacity: 0.9;
            }
            50% {
                filter: 
                    drop-shadow(0 0 15px rgba(192, 192, 192, 1))
                    drop-shadow(0 0 30px rgba(139, 0, 0, 0.8))
                    drop-shadow(0 2px 4px rgba(0, 0, 0, 1));
                opacity: 1;
            }
        }

        /* ===== الصورة مصغّرة قليلاً + margin ===== */
        .profile-img-card {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #a8a8a8;
            outline: 2px solid #0a0a0a;
            outline-offset: -6px;
            box-shadow: 
                0 0 30px rgba(192, 192, 192, 0.6),
                0 0 60px rgba(100, 100, 110, 0.3),
                inset 0 0 20px rgba(0, 0, 0, 0.7),
                0 10px 25px rgba(0, 0, 0, 0.95);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            z-index: 3;
            filter: contrast(1.1) saturate(0.85) brightness(1);
            flex-shrink: 0;
        }

        .profile-img-card:hover {
            transform: scale(1.1) rotate(3deg);
            border-color: #ffffff;
            box-shadow: 
                0 0 45px rgba(192, 192, 192, 1),
                0 0 90px rgba(100, 100, 110, 0.6),
                inset 0 0 20px rgba(0, 0, 0, 0.7);
            filter: contrast(1.15) saturate(0.9) brightness(1.05);
        }

        /* ============ أزرار التواصل ============ */
        .icons {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 4px;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
            position: relative;
            z-index: 3;
        }

        .container:hover .icons {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
            transition-delay: 0.3s;
        }

        .icon-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: 
                radial-gradient(circle at 30% 25%, #2a2a30 0%, #151518 50%, #050505 100%);
            border: 2px solid transparent;
            color: #e0e0e0;
            font-size: 19px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            box-shadow: 
                0 8px 25px rgba(0, 0, 0, 0.9),
                0 0 20px rgba(192, 192, 192, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.15),
                inset 0 -3px 8px rgba(0, 0, 0, 0.8);
            text-shadow: 0 0 12px rgba(192, 192, 192, 0.7);
        }

        .icon-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 50%;
            padding: 2px;
            background: conic-gradient(
                from 0deg,
                #c0c0c0,
                #505058,
                #8b0000,
                #505058,
                #c0c0c0
            );
            -webkit-mask: 
                linear-gradient(#fff 0 0) content-box, 
                linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0.7;
            transition: opacity 0.4s ease;
            pointer-events: none;
        }

        .icon-btn::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            height: 35%;
            border-radius: 50%;
            background: radial-gradient(
                ellipse at center top,
                rgba(255, 255, 255, 0.25) 0%,
                transparent 70%
            );
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .icon-btn:hover {
            color: #ffffff;
            transform: translateY(-5px) scale(1.15) rotate(-5deg);
            box-shadow: 
                0 15px 35px rgba(0, 0, 0, 0.95),
                0 0 35px rgba(192, 192, 192, 0.8),
                0 0 70px rgba(192, 192, 192, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.3),
                inset 0 -3px 8px rgba(0, 0, 0, 0.8);
            text-shadow: 
                0 0 15px rgba(255, 255, 255, 0.9),
                0 0 30px rgba(192, 192, 192, 0.7);
            background: 
                radial-gradient(circle at 30% 25%, #3a3a42 0%, #202025 50%, #0a0a0a 100%);
        }

        .icon-btn:hover::before {
            opacity: 1;
            animation: iconRingRotate 2s linear infinite;
        }

        .icon-btn:hover::after {
            opacity: 0;
            transform: translateX(-50%) scale(1.5);
        }

        @keyframes iconRingRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .icon-btn .glow {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(
                circle,
                rgba(192, 192, 192, 0.4) 0%,
                transparent 70%
            );
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: -1;
        }

        .icon-btn:hover .glow {
            opacity: 1;
        }

        .icon-btn i {
            position: relative;
            z-index: 2;
            transition: transform 0.4s ease;
        }

        .icon-btn:hover i {
            transform: scale(1.15);
        }

        /* ============ 4. عداد الزوار ============ */
        .visitor-counter {
            position: absolute;
            top: 30px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(5, 5, 5, 0.85);
            padding: 12px 24px;
            border-radius: 40px;
            border: 1px solid rgba(192, 192, 192, 0.25);
            backdrop-filter: blur(10px);
            font-family: 'Cinzel Decorative', serif;
            font-size: 15px;
            letter-spacing: 2px;
            color: #c0c0c0;
            opacity: 0;
            transition: opacity 1.5s ease 1.5s;
            box-shadow: 
                0 10px 30px rgba(0,0,0,0.8),
                inset 0 0 15px rgba(192, 192, 192, 0.05);
        }

        .visitor-counter i {
            color: #c0c0c0;
            animation: blink 3s infinite;
            font-size: 16px;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.6);
        }

        /* ============ 5. مشغل الموسيقى ============ */
        .music-player {
            position: fixed;
            bottom: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(192, 192, 192, 0.25);
            border-radius: 20px;
            padding: 12px 20px 12px 12px;
            box-shadow: 
                0 20px 50px rgba(0,0,0,0.95),
                inset 0 0 20px rgba(192, 192, 192, 0.05);
            opacity: 0;
            transform: translateY(30px);
            transition: all 1.5s cubic-bezier(0.19, 1, 0.22, 1) 1s;
            z-index: 100;
            min-width: 320px;
        }

        .music-player.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .album-art {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            object-fit: cover;
            border: 1px solid rgba(192, 192, 192, 0.4);
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            flex-shrink: 0;
        }

        .album-art.playing {
            animation: albumPulse 2s infinite ease-in-out;
        }

        @keyframes albumPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(192, 192, 192, 0.4); }
        }

        .track-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .track-title {
            font-family: 'Rye', 'Cinzel Decorative', serif;
            font-size: 13px;
            color: #c0c0c0;
            letter-spacing: 1px;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-shadow: 0 0 10px rgba(192, 192, 192, 0.3);
        }

        .track-artist {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 11px;
            color: #707078;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .volume-icon {
            color: #707078;
            font-size: 12px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .volume-icon:hover { color: #c0c0c0; }

        .volume-bar {
            flex: 1;
            height: 4px;
            background: rgba(192, 192, 192, 0.15);
            border-radius: 4px;
            position: relative;
            cursor: pointer;
            overflow: hidden;
        }

        .volume-fill {
            position: absolute;
            top: 0; left: 0;
            height: 100%;
            width: 40%;
            background: linear-gradient(90deg, #505058, #c0c0c0);
            border-radius: 4px;
            transition: width 0.1s ease;
            box-shadow: 0 0 10px rgba(192, 192, 192, 0.6);
        }

        .play-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: rgba(21, 21, 21, 0.9);
            border: 1px solid rgba(192, 192, 192, 0.4);
            color: #c0c0c0;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            flex-shrink: 0;
            box-shadow: inset 0 1px 0 rgba(192, 192, 192, 0.2);
        }

        .play-btn:hover {
            background: linear-gradient(135deg, #c0c0c0, #505058);
            color: #050505;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(192, 192, 192, 0.7);
            transform: scale(1.1);
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
        }

        @keyframes blink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        /* ============ للموبايل ============ */
        @media (max-width: 600px) {
            .music-player {
                left: 15px; right: 15px; bottom: 15px; min-width: auto;
            }
            .visitor-counter {
                top: 15px; right: 15px; padding: 8px 16px; font-size: 12px;
            }
            .container { height: 300px; width: 240px; }
            #entry-screen h1 { font-size: 26px; letter-spacing: 6px; }
            #entry-screen h1::before,
            #entry-screen h1::after { font-size: 9px; letter-spacing: 5px; }
            #entry-screen::after { font-size: 10px; letter-spacing: 2px; }
            .profile-img-card { width: 78px; height: 78px; }
            .heading { font-size: 14px; }
            .follow { font-size: 10px; letter-spacing: 1px; }
            .cukur-text { font-size: 17px; letter-spacing: 4px; }
            .icon-btn { width: 42px; height: 42px; font-size: 17px; }
            .icons { gap: 16px; }
        }
    </style>
</head>
<body>

    <!-- شاشة الدخول مع فيديو المقدمة (بدون صوت) -->
    <div id="entry-screen">
        <video id="intro-video" autoplay muted loop playsinline preload="auto">
            <source src="intro.mp4" type="video/mp4">
        </video>
        <h1>CLICK TO ENTER</h1>
    </div>

    <!-- فيديو الخلفية للبروفايل -->
    <video class="video-bg" id="bg-video" loop playsinline preload="auto">
        <source src="background.mp4" type="video/mp4">
    </video>
    
    <div class="overlay" id="overlay"></div>

    <div class="visitor-counter" id="counter">
        <i class="fa-solid fa-eye"></i>
        <span id="visitor-count">...</span>
    </div>

    <div class="music-player" id="music-player">
        <img src="profile.gif" alt="Album Art" class="album-art" id="album-art">
        
        <div class="track-info">
            <div class="track-title" id="track-title">ABD AL-HAMEED</div>
            <div class="track-artist" id="track-artist">Now Playing</div>
            
            <div class="volume-container">
                <i class="fa-solid fa-volume-high volume-icon" id="volume-icon"></i>
                <div class="volume-bar" id="volume-bar">
                    <div class="volume-fill" id="volume-fill"></div>
                </div>
            </div>
        </div>
        
        <button class="play-btn" id="play-btn">
            <i class="fa-solid fa-pause" id="play-icon"></i>
        </button>
    </div>

    <!-- البطاقة الفخمة - Çukur Style -->
    <div class="container" id="card">
        <div class="card">
            <div class="card-top">
                <p class="card-top-para">ABD AL-HAMEED</p>
            </div>

            <!-- الوجه الأمامي: الصورة + الاسم + المدينة + ÇUKUR + الأزرار -->
            <div class="front">
                <img src="profile.gif" alt="ABD AL-HAMEED" class="profile-img-card">
                <div class="heading">ABD AL-HAMEED</div>
                <div class="follow">Umm al-Fahm, Israel</div>
                <div class="cukur-text">ÇUKUR</div>
                <div class="icons">
                    <a href="https://www.tiktok.com/@aboshlomo?is_from_webapp=1&sender_device=pc" target="_blank" class="icon-btn" title="TikTok">
                        <span class="glow"></span>
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://discord.gg/P6CZzhK6" target="_blank" class="icon-btn" title="Discord">
                        <span class="glow"></span>
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </div>
            </div>

            <!-- الوجه الخلفي: الاسم + ÇUKUR + الأزرار -->
            <div class="back">
                <div class="heading">ABD AL-HAMEED</div>
                <div class="cukur-text">ÇUKUR</div>
                <div class="icons">
                    <a href="https://www.tiktok.com/@aboshlomo?is_from_webapp=1&sender_device=pc" target="_blank" class="icon-btn" title="TikTok">
                        <span class="glow"></span>
                        <i class="fa-brands fa-tiktok"></i>
                    </a>
                    <a href="https://discord.gg/P6CZzhK6" target="_blank" class="icon-btn" title="Discord">
                        <span class="glow"></span>
                        <i class="fa-brands fa-discord"></i>
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const entryScreen = document.getElementById('entry-screen');
        const introVideo = document.getElementById('intro-video');
        const bgVideo = document.getElementById('bg-video');
        const overlay = document.getElementById('overlay');
        const card = document.getElementById('card');
        const counter = document.getElementById('counter');
        const musicPlayer = document.getElementById('music-player');
        const playBtn = document.getElementById('play-btn');
        const playIcon = document.getElementById('play-icon');
        const volumeBar = document.getElementById('volume-bar');
        const volumeFill = document.getElementById('volume-fill');
        const volumeIcon = document.getElementById('volume-icon');
        const albumArt = document.getElementById('album-art');
        const trackArtist = document.getElementById('track-artist');

        // ===== 1. تشغيل فيديو المقدمة (بدون صوت دائماً) =====
        introVideo.muted = true;
        introVideo.loop = true;
        introVideo.play().catch(e => console.log("Intro autoplay blocked:", e));

        // ===== 2. تجهيز فيديو الخلفية =====
        overlay.style.display = 'block';
        bgVideo.style.display = 'block';
        bgVideo.muted = true;
        bgVideo.volume = 0.4;
        bgVideo.pause();

        bgVideo.addEventListener('playing', () => { trackArtist.innerText = 'Now Playing'; });
        bgVideo.addEventListener('waiting', () => { trackArtist.innerText = 'Buffering...'; });
        bgVideo.addEventListener('error', (e) => console.log("Video error:", e));

        // ===== 3. عند الضغط على شاشة الدخول =====
        let entered = false;
        entryScreen.addEventListener('click', async () => {
            if (entered) return;
            entered = true;

            entryScreen.style.opacity = '0';
            setTimeout(() => { 
                entryScreen.style.display = 'none';
                introVideo.pause();
            }, 800);

            bgVideo.currentTime = 0;
            bgVideo.muted = false;
            bgVideo.volume = 0.4;
            
            try {
                await bgVideo.play();
                trackArtist.innerText = 'Now Playing';
            } catch (e) {
                console.log("bgVideo play error:", e);
                bgVideo.muted = true;
                try {
                    await bgVideo.play();
                    bgVideo.muted = false;
                    trackArtist.innerText = 'Now Playing';
                } catch (e2) {
                    console.log("Fallback failed:", e2);
                    trackArtist.innerText = 'اضغط زر التشغيل';
                }
            }

            card.style.display = 'block';
            counter.style.display = 'flex';

            setTimeout(() => {
                card.style.opacity = '1';
                card.style.transform = 'translateY(0) scale(1)';
                counter.style.opacity = '1';
                musicPlayer.classList.add('visible');
                albumArt.classList.add('playing');
            }, 100);

            updateVolumeUI();
        });

        // ===== 4. إعادة تشغيل الفيديو عند الانتهاء =====
        bgVideo.addEventListener('ended', () => {
            bgVideo.currentTime = 0;
            bgVideo.play().catch(e => console.log("Video loop error:", e));
        });

        // ===== 5. التحكم بالموسيقى =====
        playBtn.addEventListener('click', () => {
            if (bgVideo.paused) {
                bgVideo.play().catch(e => console.log(e));
                playIcon.className = 'fa-solid fa-pause';
                albumArt.classList.add('playing');
            } else {
                bgVideo.pause();
                playIcon.className = 'fa-solid fa-play';
                albumArt.classList.remove('playing');
            }
        });

        // ===== 6. التحكم بمستوى الصوت =====
        let isDragging = false;

        function setVolume(e) {
            const rect = volumeBar.getBoundingClientRect();
            let x = (e.clientX || e.touches[0].clientX) - rect.left;
            let percent = Math.max(0, Math.min(1, x / rect.width));
            bgVideo.volume = percent;
            volumeFill.style.width = (percent * 100) + '%';
            updateVolumeIcon(percent);
        }

        function updateVolumeUI() {
            volumeFill.style.width = (bgVideo.volume * 100) + '%';
            updateVolumeIcon(bgVideo.volume);
        }

        function updateVolumeIcon(vol) {
            volumeIcon.className = 'volume-icon fa-solid ' + 
                (vol === 0 ? 'fa-volume-xmark' : 
                 vol < 0.5 ? 'fa-volume-low' : 
                 'fa-volume-high');
        }

        volumeBar.addEventListener('mousedown', (e) => { isDragging = true; setVolume(e); });
        document.addEventListener('mousemove', (e) => { if (isDragging) setVolume(e); });
        document.addEventListener('mouseup', () => { isDragging = false; });

        volumeBar.addEventListener('touchstart', (e) => { isDragging = true; setVolume(e); });
        document.addEventListener('touchmove', (e) => { if (isDragging) setVolume(e); });
        document.addEventListener('touchend', () => { isDragging = false; });

        volumeIcon.addEventListener('click', () => {
            if (bgVideo.volume > 0) {
                bgVideo.dataset.prevVolume = bgVideo.volume;
                bgVideo.volume = 0;
            } else {
                bgVideo.volume = bgVideo.dataset.prevVolume || 0.4;
            }
            updateVolumeUI();
        });

        // ===== 7. عداد الزوار =====
        (function () {
            const el = document.getElementById('visitor-count');
            const NS = 'abdulhameed-profile', KEY = 'visits';
            const cached = parseInt(localStorage.getItem('abdulhameed-count') || '0', 10);
            if (cached > 0) el.innerText = cached.toLocaleString();
            const last = parseInt(localStorage.getItem('abdulhameed-last') || '0', 10);
            const now = Date.now();
            const url = (now - last < 10000)
                ? `https://abacus.jasoncameron.dev/get/${NS}/${KEY}`
                : `https://abacus.jasoncameron.dev/hit/${NS}/${KEY}`;
            if (now - last >= 10000) localStorage.setItem('abdulhameed-last', String(now));
            fetch(url)
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(d => {
                    el.innerText = Number(d.value).toLocaleString();
                    localStorage.setItem('abdulhameed-count', d.value);
                })
                .catch(() => {
                    el.innerText = cached > 0 ? cached.toLocaleString() : '1';
                });
        })();
    </script>

</body>
</html>
